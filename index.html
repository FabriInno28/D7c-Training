<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E5">
<title>10 Minuten on Top – Fels</title>
<style>
:root{--paper:#F5F0E5;--ink:#0B1D2C;--yellow:#F2B51D;--navy:#0B2234;--line:#D8D0C1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
.shell{min-height:100vh;background:linear-gradient(180deg,#f7f2e8,#fbf8f1 55%,#f3ede1)}
.topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,48px);background:rgba(248,244,235,.96);border-bottom:1px solid #e5ded2;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-size:clamp(20px,2.5vw,28px);font-weight:950}.brand-badge{display:grid;place-items:center;width:58px;height:50px;background:var(--yellow);border-radius:14px}
.back{border:1px solid #c8c4bc;background:#fff;padding:12px 16px;border-radius:999px;font-weight:900;cursor:pointer}
.hero{max-width:1420px;margin:auto;padding:28px clamp(16px,3vw,34px) 12px;display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{font-size:clamp(48px,6vw,78px);line-height:.9;letter-spacing:-.055em;margin:0}.hero p{font-size:clamp(18px,2vw,24px);font-weight:800;margin:10px 0 0}.helper{max-width:320px;border:1px solid var(--line);border-radius:18px;padding:14px 18px;background:#ffffff8c;font-size:14px;line-height:1.45}
.grid{max-width:1420px;margin:auto;padding:12px clamp(16px,3vw,34px) 36px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;border:1px solid #cbc5ba;border-radius:24px;overflow:hidden;box-shadow:0 10px 28px rgba(10,25,38,.08)}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 18px 12px}.num{width:46px;height:46px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;font-weight:950;font-size:24px}.card h2{font-size:clamp(24px,2.8vw,34px);margin:0;letter-spacing:-.035em}
.visual{height:250px;background:#cfe1e7;overflow:hidden}.visual img{display:block;width:100%;height:100%;object-fit:cover}
.card-body{padding:16px 18px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-weight:700;color:#41484d}.steps li{position:relative;padding-left:18px}.steps li:before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;background:var(--yellow);border-radius:50%}
.controls{display:flex;flex-direction:column;gap:10px;min-width:170px}.duration{text-align:center;font-weight:900}.start{border:0;border-radius:15px;padding:14px 20px;background:var(--yellow);font-weight:950;cursor:pointer;box-shadow:0 6px 0 #d59d00}
.timerbox{display:none;grid-column:1/-1;border-top:1px solid #ebe5da;padding-top:16px}.card.active .timerbox{display:block}.clock{font-size:clamp(56px,6vw,86px);font-weight:950;letter-spacing:-.06em}.track{height:9px;background:#e9e3d8;border-radius:99px;overflow:hidden;margin:10px 0 12px}.fill{height:100%;background:#2F7D86;transform-origin:left center}.timer-actions{display:flex;gap:10px;flex-wrap:wrap}.timer-actions button{border:0;border-radius:13px;padding:12px 15px;font-weight:900;cursor:pointer}.pause{background:#ece7de}.again{background:var(--yellow)}.close{background:var(--navy);color:#fff}
.world{min-height:100vh;background:#111}.world-wrap{position:relative;max-width:1600px;margin:auto}.world img{display:block;width:100%;height:auto}.world-hot{position:absolute;left:48%;top:15%;width:18%;height:13%;border:0;background:transparent;border-radius:24px}
@media(max-width:900px){.hero{display:block}.helper{margin-top:16px;max-width:none}.grid{grid-template-columns:1fr}}
@media(max-width:560px){.brand-badge{width:48px;height:42px}.back{font-size:12px;padding:9px 12px}.helper{display:none}.hero h1{font-size:52px}.grid{padding-left:12px;padding-right:12px}.visual{height:215px}.card-body{grid-template-columns:1fr}.controls{min-width:0;display:grid;grid-template-columns:1fr 1fr;align-items:center}.duration{text-align:left}.clock{font-size:68px}}
</style>
</head>

let run=null;const app=document.getElementById('app');
const head=()=>`<header class="topbar"><div class="brand"><span class="brand-badge">10′</span><span>MINUTEN ON TOP</span></div><button class="back" onclick="renderWorld()">← ZURÜCK ZUR WELT</button></header>`;
function renderTraining(){clearRun();app.innerHTML=`<div class="shell">${head()}<section class="hero"><div><h1>${t.title}</h1><p>${t.statement}</p></div><div class="helper"><b>SO TRAINIERST DU</b><br>Wähle eine Übung. Schau zuerst die Bewegung an. Starte dann den Timer.</div></section><section class="grid">${t.exercises.map((e,i)=>card(e,i)).join('')}</section></div>`}
function card(e,i){return `<article class="card" id="card-${e.id}"><div class="card-head"><span class="num">${i+1}</span><h2>${e.title}</h2></div><div class="visual"><img src="${e.image}" alt="${e.title}"></div><div class="card-body"><ul class="steps">${e.steps.map(s=>`<li>${s}</li>`).join('')}</ul><div class="controls"><div class="duration">◷ ${e.duration} SEKUNDEN</div><button class="start" onclick="start('${e.id}')">START</button></div><div class="timerbox"><div class="clock" data-clock="${e.id}">00:${String(e.duration).padStart(2,'0')}</div><div class="track"><div class="fill" data-fill="${e.id}"></div></div><div class="timer-actions"><button class="pause" onclick="pause()">PAUSE</button><button class="again" onclick="restart('${e.id}')">NOCHMALS</button><button class="close" onclick="stop()">SCHLIESSEN</button></div></div></div></article>`}
function renderWorld(){clearRun();app.innerHTML=`<section class="world"><div class="world-wrap"><img src="${worldImage}" alt="Trainingswelt"><button class="world-hot" onclick="renderTraining()" aria-label="Fels öffnen"></button></div></section>`}
function start(id){clearRun();document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));let e=t.exercises.find(x=>x.id===id);document.getElementById('card-'+id).classList.add('active');runTimer(e)}
function runTimer(e){let left=e.duration;update(e.id,left,e.duration);run={id:e.id,left,total:e.duration,paused:false,interval:setInterval(()=>{if(!run||run.paused)return;run.left--;update(e.id,run.left,run.total);if(run.left<=0){beep();clearInterval(run.interval);run.interval=null}},1000)}}
function update(id,left,total){let c=document.querySelector(`[data-clock="${id}"]`),f=document.querySelector(`[data-fill="${id}"]`);if(c)c.textContent='00:'+String(Math.max(0,left)).padStart(2,'0');if(f)f.style.transform=`scaleX(${Math.max(0,left/total)})`}
function pause(){if(run)run.paused=!run.paused}
function restart(id){let e=t.exercises.find(x=>x.id===id);clearRun();document.getElementById('card-'+id).classList.add('active');runTimer(e)}
function stop(){clearRun();document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'))}
function clearRun(){if(run?.interval)clearInterval(run.interval);run=null}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=700;g.gain.value=.08;o.start();o.stop(a.currentTime+.18)}catch(e){}}
renderTraining();
</script>
